<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Desktop Calendar</title>
    <link rel="stylesheet" href="./src/styles.css?v=0.1.21" />
  </head>
  <body>
    <div class="app-shell">
      <div class="resize-handle resize-n" data-resize-edge="n" aria-hidden="true"></div>
      <div class="resize-handle resize-e" data-resize-edge="e" aria-hidden="true"></div>
      <div class="resize-handle resize-s" data-resize-edge="s" aria-hidden="true"></div>
      <div class="resize-handle resize-w" data-resize-edge="w" aria-hidden="true"></div>
      <div class="resize-handle resize-ne" data-resize-edge="ne" aria-hidden="true"></div>
      <div class="resize-handle resize-nw" data-resize-edge="nw" aria-hidden="true"></div>
      <div class="resize-handle resize-se" data-resize-edge="se" aria-hidden="true"></div>
      <div class="resize-handle resize-sw" data-resize-edge="sw" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-block">
          <span class="eyebrow">LOCAL DESKTOP</span>
          <h1>Desktop Calendar</h1>
        </div>

        <div class="month-controls" aria-label="달 이동">
          <button class="icon-button" id="prevMonth" type="button" aria-label="이전 달">‹</button>
          <button class="plain-button" id="todayButton" type="button">오늘</button>
          <button class="icon-button" id="nextMonth" type="button" aria-label="다음 달">›</button>
        </div>

        <div class="current-month" id="currentMonth" aria-live="polite"></div>

        <div class="toolbar">
          <label class="search-box" for="searchInput">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="검색" autocomplete="off" />
          </label>
          <select id="categoryFilter" aria-label="분류 필터"></select>
          <button class="plain-button" id="notificationButton" type="button">알림</button>
          <button class="plain-button" id="lockToggleButton" type="button">잠금</button>
          <button class="plain-button" id="appearanceButton" type="button">설정</button>
          <button class="plain-button" id="fullscreenButton" type="button">전체화면</button>
        </div>

        <div class="window-controls" aria-label="창 제어">
          <button class="window-control-button" id="windowMinimizeButton" type="button" aria-label="최소화" title="최소화">
            <span class="control-icon control-icon-minimize"></span>
          </button>
          <button class="window-control-button" id="windowMaximizeButton" type="button" aria-label="최대화 또는 복원" title="최대화/복원">
            <span class="control-icon control-icon-maximize"></span>
          </button>
          <button class="window-control-button close" id="windowCloseButton" type="button" aria-label="닫기" title="닫기">
            <span class="control-icon control-icon-close"></span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="calendar-panel" aria-label="월간 달력">
          <div class="weekday-row" id="weekdayRow"></div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </section>

        <aside class="side-panel" aria-label="일정 편집">
          <section class="editor-section">
            <div class="section-heading">
              <span>선택 날짜</span>
              <strong id="selectedDateLabel"></strong>
            </div>

            <form class="event-form" id="eventForm">
              <input id="eventId" type="hidden" />

              <div class="field-row">
                <label for="eventDate">날짜</label>
                <input id="eventDate" type="date" required />
              </div>

              <div class="field-grid">
                <div class="field-row">
                  <label for="eventTime">시간</label>
                  <input id="eventTime" type="time" />
                </div>
                <div class="field-row">
                  <label for="eventCategory">분류</label>
                  <select id="eventCategory"></select>
                </div>
              </div>

              <div class="field-row">
                <label for="eventTitle">일정</label>
                <input id="eventTitle" type="text" maxlength="80" required autocomplete="off" />
              </div>

              <div class="field-grid">
                <div class="field-row">
                  <label for="eventRepeat">반복</label>
                  <select id="eventRepeat">
                    <option value="none">없음</option>
                    <option value="daily">매일</option>
                    <option value="weekly">매주</option>
                    <option value="monthly">매월</option>
                    <option value="yearly">매년</option>
                  </select>
                </div>
                <div class="field-row">
                  <label for="eventReminder">알림</label>
                  <select id="eventReminder">
                    <option value="none">없음</option>
                    <option value="0">정시</option>
                    <option value="10">10분 전</option>
                    <option value="30">30분 전</option>
                    <option value="60">1시간 전</option>
                    <option value="1440">하루 전</option>
                  </select>
                </div>
              </div>

              <div class="field-row">
                <label for="eventNotes">메모</label>
                <textarea id="eventNotes" rows="4" maxlength="600"></textarea>
              </div>

              <label class="check-row" for="eventDone">
                <input id="eventDone" type="checkbox" />
                <span>완료</span>
              </label>

              <div class="form-actions">
                <button class="primary-button" type="submit">저장</button>
                <button class="plain-button" id="newEventButton" type="button">새 일정</button>
                <button class="danger-button" id="deleteEventButton" type="button">삭제</button>
              </div>
            </form>
          </section>

          <section class="agenda-section">
            <div class="section-heading">
              <span>오늘</span>
              <strong id="todayCount"></strong>
            </div>
            <div class="agenda-list" id="todayList"></div>
          </section>

          <section class="agenda-section">
            <div class="section-heading">
              <span>다음 7일</span>
              <strong id="weekCount"></strong>
            </div>
            <div class="agenda-list" id="weekList"></div>
          </section>

          <section class="agenda-section">
            <div class="section-heading">
              <span>검색 결과</span>
              <strong id="searchCount"></strong>
            </div>
            <div class="agenda-list" id="searchResults"></div>
          </section>
        </aside>
      </main>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="modal-backdrop" id="dayDetailModal" hidden>
        <section class="modal-panel day-detail-panel" role="dialog" aria-modal="true" aria-labelledby="dayDetailTitle">
          <div class="modal-heading">
            <div>
              <span class="eyebrow">DAY SCHEDULE</span>
              <h2 id="dayDetailTitle">일정 입력</h2>
            </div>
            <button class="icon-button" id="dayDetailClose" type="button" aria-label="닫기">×</button>
          </div>

          <strong class="day-detail-date" id="dayDetailDate"></strong>

          <form class="quick-event-form" id="dayQuickForm">
            <div class="field-grid">
              <div class="field-row">
                <label for="dayQuickTime">시간</label>
                <input id="dayQuickTime" type="time" />
              </div>
              <div class="field-row">
                <label for="dayQuickCategory">분류</label>
                <select id="dayQuickCategory"></select>
              </div>
            </div>

            <div class="field-row">
              <label for="dayQuickTitle">일정</label>
              <input id="dayQuickTitle" type="text" maxlength="80" required autocomplete="off" />
            </div>

            <div class="field-row">
              <label for="dayQuickNotes">메모</label>
              <textarea id="dayQuickNotes" rows="3" maxlength="600"></textarea>
            </div>

            <div class="form-actions">
              <button class="primary-button" type="submit">이 날짜에 추가</button>
              <button class="plain-button" id="dayDetailNewButton" type="button">입력 비우기</button>
            </div>
          </form>

          <div class="day-event-list" id="dayEventList"></div>
        </section>
      </div>

      <div class="modal-backdrop" id="windowSizeModal" hidden>
        <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="windowSizeTitle">
          <div class="modal-heading">
            <h2 id="windowSizeTitle">창 크기와 위치</h2>
            <button class="icon-button" id="windowSizeClose" type="button" aria-label="닫기">×</button>
          </div>

          <div class="field-row">
            <label for="windowSizeMode">모드</label>
            <select id="windowSizeMode">
              <option value="Auto">자동</option>
              <option value="Compact">작게</option>
              <option value="Normal">보통</option>
              <option value="Large">크게</option>
              <option value="FullDesktop">전체 바탕화면</option>
              <option value="Custom">직접 설정</option>
            </select>
          </div>

          <div class="size-control-grid">
            <div class="field-row">
              <label for="windowWidthRange">너비 <strong id="windowWidthValue"></strong></label>
              <input id="windowWidthRange" type="range" min="760" max="1800" step="10" />
            </div>
            <div class="field-row">
              <label for="windowHeightRange">높이 <strong id="windowHeightValue"></strong></label>
              <input id="windowHeightRange" type="range" min="460" max="1100" step="10" />
            </div>
          </div>

          <div class="size-control-grid">
            <div class="field-row">
              <label for="windowLeftRange">가로 위치 <strong id="windowLeftValue"></strong></label>
              <input id="windowLeftRange" type="range" min="0" max="1200" step="10" />
            </div>
            <div class="field-row">
              <label for="windowTopRange">세로 위치 <strong id="windowTopValue"></strong></label>
              <input id="windowTopRange" type="range" min="0" max="800" step="10" />
            </div>
          </div>

          <div class="form-actions">
            <button class="primary-button" id="windowSizeApply" type="button">적용</button>
            <button class="plain-button" id="windowCenterButton" type="button">가운데</button>
            <button class="plain-button" id="windowSizeRefresh" type="button">현재값 읽기</button>
          </div>
        </section>
      </div>

      <div class="modal-backdrop" id="appearanceModal" hidden>
        <section class="modal-panel settings-panel" role="dialog" aria-modal="true" aria-labelledby="appearanceTitle">
          <div class="modal-heading">
            <h2 id="appearanceTitle">표시 설정</h2>
            <button class="icon-button" id="appearanceClose" type="button" aria-label="닫기">×</button>
          </div>

          <label class="check-row" for="lockWindowSetting">
            <input id="lockWindowSetting" type="checkbox" />
            <span>편집 잠금 시 바탕화면 아이콘 우선 클릭</span>
          </label>

          <div class="field-row">
            <label for="themeSelect">테마</label>
            <select id="themeSelect">
              <option value="cyan">청록</option>
              <option value="graphite">흑연</option>
              <option value="forest">녹색</option>
              <option value="sunset">붉은 갈색</option>
            </select>
          </div>

          <div class="field-row">
            <label for="overlayOpacityRange">투명도 <strong id="overlayOpacityValue"></strong></label>
            <input id="overlayOpacityRange" type="range" min="10" max="70" step="5" />
          </div>

          <div class="field-row">
            <label for="fontScaleRange">글자 크기 <strong id="fontScaleValue"></strong></label>
            <input id="fontScaleRange" type="range" min="85" max="125" step="5" />
          </div>

          <div class="form-actions">
            <button class="primary-button" id="appearanceApply" type="button">적용</button>
            <button class="plain-button" id="appearanceReset" type="button">기본값</button>
          </div>
        </section>
      </div>
    </div>

    <script src="./src/app.js?v=0.1.21"></script>
  </body>
</html>
