name: Desktop Calendar Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop Calendar version, for example 0.1.22
        required: false
        default: 0.1.22
  push:
    paths:
      - desktop-calendar/**
      - .github/workflows/desktop-calendar-release.yml
    tags:
      - desktop-calendar-v*

permissions:
  contents: write

jobs:
  package:
    name: Package Desktop Calendar
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/desktop-calendar-v*") {
            $version = "${{ github.ref_name }}" -replace "^desktop-calendar-v", ""
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "0.1.${{ github.run_number }}"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          desktop-calendar/scripts/package-desktop-calendar-release.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Runtimes win-x64,win-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCalendar-${{ steps.version.outputs.version }}
          path: |
            desktop-calendar/dist/*.zip
            desktop-calendar/dist/SHA256SUMS.txt
            desktop-calendar/dist/release-manifest.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-calendar-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-calendar/dist/*.zip
            desktop-calendar/dist/SHA256SUMS.txt
            desktop-calendar/dist/release-manifest.json
